packages:
  - .
  - packages/*

# Reject dependency versions published less than 7 days ago.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - badinage
minimumReleaseAgeStrict: true

# Fail install when a dependency wants to run a build script that is not allowlisted.
strictDepBuilds: true
allowBuilds:
  esbuild: true

# Block unexpected injected transitive dependencies.
blockExoticSubdeps: true

# Reinstall when node_modules is stale instead of running against it.
verifyDepsBeforeRun: install

# Keep the virtual store fully isolated, no hoisting to the root.
hoistPattern: []
publicHoistPattern: []

savePrefix: ''

patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch

overrides:
  # typed-rest-client (pulled in by stryker) pins a vulnerable qs range
  'typed-rest-client>qs': '6.16.0'
  # @lhci/cli is pinned at its latest release, so its vulnerable
  # transitive deps need overrides. extract-zip has no patched release
  'body-parser>qs': '6.16.0'
  'express>qs': '6.16.0'
  'external-editor>tmp': '0.2.7'
  '@lhci/cli>tmp': '0.2.7'
  '@lhci/cli>uuid': '11.1.1'
