<!doctype html>
<!-- static-hosting 404 page (nginx / GitHub Pages style). GitHub Pages
     serves this automatically for unknown paths; nginx needs an
     error_page directive pointing here. The link back to the app root
     honors the VITE_BASE it was built with. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Page not found - Badinage" />
    <meta property="og:title" content="404 - Badinage" />
    <meta property="og:type" content="website" />
    <title>404 - Badinage</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        text-align: center;
        padding: 0 1rem;
      }
      h1 {
        font-size: 3rem;
        margin: 0 0 0.5rem;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page does not exist.</p>
      <p><a href="./">Back to Badinage</a></p>
    </main>
  </body>
</html>
