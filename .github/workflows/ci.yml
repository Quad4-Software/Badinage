name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
      fail-fast: false
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm knip
      - run: pnpm --filter @quad4-software/omemo typecheck
      - run: pnpm --filter @quad4-software/omemo test
      - run: pnpm --filter @quad4-software/omemo build
      - run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '24'
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: start dev prosody
        run: docker compose -f docker/dev/compose.yaml up -d prosody

      - name: wait for prosody
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5280/ && exit 0
            sleep 1
          done
          echo "prosody did not come up in 30s" >&2
          exit 1

      - name: seed e2e users
        run: |
          docker compose -f docker/dev/compose.yaml exec -T prosody prosodyctl register e2e-alice localhost e2e-alice-pass
          docker compose -f docker/dev/compose.yaml exec -T prosody prosodyctl register e2e-bob localhost e2e-bob-pass

      - run: pnpm test:e2e
        env:
          E2E_PROSODY: '1'

      - name: stop dev prosody
        if: always()
        run: docker compose -f docker/dev/compose.yaml down -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm bench 2>&1 | tee bench-output.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-output
          path: bench-output.txt
          retention-days: 30
