name: publish-omemo

on:
  push:
    tags: ['omemo-v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-omemo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm --filter @quad4-software/omemo test

      - name: build
        run: pnpm --filter @quad4-software/omemo build

      - name: check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#omemo-v}"
          PKG="$(node -p "require('./packages/omemo/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag omemo-v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: pack tarball
        working-directory: packages/omemo
        run: pnpm pack

      - name: publish to github packages
        working-directory: packages/omemo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@quad4-software:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm publish --no-git-checks
          rm .npmrc

      - name: attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/omemo/*.tgz
