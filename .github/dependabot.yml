version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      devtools:
        patterns: ['eslint*', 'prettier*', 'vitest*', 'playwright*', 'svelte-check']

  - package-ecosystem: npm
    directory: /packages/omemo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
