server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP notes (audited against the vite build output):
    # - connect-src: XMPP websocket and BOSH endpoints are user-supplied,
    #   plus XEP-0156 host-meta discovery fetches arbitrary domains, so
    #   wss: and https: are required. wss: without ws: and https: without
    #   http: force TLS for remote endpoints.
    # - telemetry note: when the app is built with VITE_SENTRY_DSN, the
    #   DSN origin must be reachable through connect-src. The default
    #   https: entry already covers it; tighten only if you remove that.
    # - style-src keeps unsafe-inline: the compiled bundle sets style
    #   attributes (Svelte style={} bindings, bits-ui/paneforge internals)
    #   and paneforge injects a <style> element for the drag cursor. Both
    #   would break under a strict style policy. script-src has no
    #   unsafe-inline; the build emits no inline scripts.
    # - media-src allows data: because the upload fallback inlines small
    #   attachments as data URIs.
    # - wasm-unsafe-eval is reserved for a future OMEMO WASM module.
    # - worker-src blob: is the extension sandbox: workers spawn from
    #   generated blob sources, never from remote URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
