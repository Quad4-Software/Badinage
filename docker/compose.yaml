# Production compose. Badinage is a static web app: it connects to whatever
# XMPP server the user picks at login. Bring your own server, or use the dev
# stack in docker/dev/ for a bundled Prosody.

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-}
    image: badinage:latest
    ports:
      - '8080:8080'
    restart: unless-stopped
