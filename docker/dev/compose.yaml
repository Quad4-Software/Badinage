# Dev stack: Vite dev server plus local chat servers for testing.
#   docker compose -f docker/dev/compose.yaml up
#
# Prosody listens on 5280 (BOSH+WS over http). Register an account at
# login with any jid like test@localhost since in-band registration is on.
# Anonymous login lives on the anon.localhost virtual host: pick the
# anonymous option, enter anon.localhost as the domain, and give the
# websocket url ws://localhost:5280/xmpp-websocket as the server.
#
# Ergo listens on 6667 (plain IRC) and 8097 (WebSocket). Log in at the
# client with the IRC protocol, ws://localhost:8097, any nick and an
# optional SASL password. Register an account first with
# /msg NickServ REGISTER <password> from any IRC client, or connect
# anonymously without a password.
#
# ejabberd listens on 15280 (WebSocket at /websocket, same shape as
# prosody: register in-band at login or sign in anonymously on the
# anon.localhost host). Openfire listens on 17070 (WebSocket at /ws/,
# BOSH at /http-bind/). It self-provisions from openfire.xml on first
# boot: domain localhost, embedded database, anonymous auth enabled.
# The xmpp interop vitest suite exercises all three:
#   XMPP_INTEROP_WS=ws://localhost:15280/websocket \
#     pnpm vitest run src/lib/core/xmpp/tests/interop.live.test.ts

services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ../../:/app
      - node_modules:/app/node_modules
    depends_on:
      - prosody
      - ergo

  prosody:
    image: prosody/prosody:latest@sha256:984d473833c8401e049c63039b93a6fd1cdffa1f4abe3e93d005f34b3c87b893
    ports:
      - '5222:5222'
      - '${PROSODY_HTTP_PORT:-5280}:5280'
    volumes:
      - prosody_data:/var/lib/prosody
      - ./prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
    restart: unless-stopped

  ergo:
    image: ghcr.io/ergochat/ergo:stable@sha256:72db5b93b437ea0512fb79d9d4d035f0916ccba07ed736dec19e8d5b5a73f972
    entrypoint: /ircd-bin/ergo run --conf /ircd-conf/ircd.yaml
    ports:
      - '6667:6667'
      - '8097:8097'
    volumes:
      - ergo_data:/ircd
      - ./ergo/ircd.yaml:/ircd-conf/ircd.yaml:ro
    restart: unless-stopped

  ejabberd:
    image: ejabberd/ecs:latest@sha256:3d120adff1ba1f2993d1ededed6c1eb7f5f6d9c9ad645d32b3e505e8dedeec35
    ports:
      - '15280:5280'
    volumes:
      - ejabberd_data:/opt/ejabberd/database
      - ./ejabberd/ejabberd.yml:/opt/ejabberd/conf/ejabberd.yml:ro
    restart: unless-stopped

  openfire:
    image: ghcr.io/igniterealtime/openfire:main@sha256:767ac7088da09509057324fd12c427d79a6caf80bd8279e43a59605e7b812258
    # the autosetup block deletes itself from openfire.xml on first
    # boot, so seed a writable copy instead of bind-mounting the file
    entrypoint:
      [
        '/bin/bash',
        '-c',
        'mkdir -p /var/lib/openfire/conf && cp /seed/openfire.xml /seed/security.xml /var/lib/openfire/conf/ && exec /sbin/entrypoint.sh'
      ]
    ports:
      - '17070:7070'
    volumes:
      - openfire_data:/var/lib/openfire
      - ./openfire/openfire.xml:/seed/openfire.xml:ro
      - ./openfire/security.xml:/seed/security.xml:ro
    restart: unless-stopped

volumes:
  node_modules:
  prosody_data:
  ergo_data:
  ejabberd_data:
  openfire_data:
